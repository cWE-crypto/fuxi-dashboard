name: 伏羲数据定时采集

on:
  schedule:
    # 每小时整点运行一次（cron 时区为 UTC，频率不受影响）
    - cron: '0 * * * *'
  # 支持手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r deploy/requirements.txt

      - name: 采集伏羲数据
        env:
          FUXI_USERNAME: ${{ secrets.FUXI_USERNAME }}
          FUXI_PASSWORD: ${{ secrets.FUXI_PASSWORD }}
        run: |
          cd deploy
          python fuxi_collector.py --output ../data/fuxi_data.json --days 14

      - name: 提交数据更新并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuxi_data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 定时采集更新数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
