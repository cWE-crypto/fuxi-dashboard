name: 伏羲数据定时采集 + 双源合并

on:
  schedule:
    # 每小时第 13 分运行（UTC xx:13 = 北京 xx:13+8；GitHub 调度可能延迟或丢弃，属平台已知限制，
    # 备用通道：WorkBuddy 本机每小时定时任务也会采集并推送，双保险保证数据更新）
    - cron: '13 * * * *'
  # 支持手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r deploy/requirements.txt

      - name: 采集伏羲数据
        env:
          FUXI_USERNAME: ${{ secrets.FUXI_USERNAME }}
          FUXI_PASSWORD: ${{ secrets.FUXI_PASSWORD }}
        run: |
          cd deploy
          python fuxi_collector.py --output ../data/fuxi_data.json --days 14

      # MES 需要本地扫码登录，无法在 GitHub Actions 里采集；
      # 所以这里只把已存在的 mes_data.json 与最新 fuxi_data.json 合并，
      # 若 mes_data.json 不存在则跳过合并步骤。
      - name: 合并 MES + 伏羲 数据
        run: |
          cd deploy
          if [ -f "../data/mes_data.json" ]; then
            python merge_mes_fuxi.py \
              --mes ../data/mes_data.json \
              --fuxi ../data/fuxi_data.json \
              --out ../data/combined_data.json
          else
            echo "mes_data.json 不存在，跳过合并"
          fi

      - name: 提交数据更新并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuxi_data.json data/combined_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 定时采集更新数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
